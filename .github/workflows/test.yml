name: Go tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Unit and MetricsDB persistence tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
  live-soxl:
    # A live market-data test may fail if Yahoo rate-limits hosted CI runners.
    # It is intentionally non-blocking; the deterministic test suite is mandatory.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go mod tidy
      - name: Backtest six months of SOXL / SOXS
        run: go run ./cmd/cryptoscan --pair SOXL:SOXS --months 6
      - name: Repeat request (should use cached historical candles)
        run: go run ./cmd/cryptoscan --pair SOXL:SOXS --months 6
      - name: Backtest six months of MSTR / MSTZ
        run: go run ./cmd/cryptoscan --pair MSTR:MSTZ --months 6
