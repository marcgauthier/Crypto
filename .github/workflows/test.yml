name: Go tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Unit and MetricsDB persistence tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
  live-soxl:
    # A live market-data test may fail if Yahoo rate-limits hosted CI runners.
    # It is intentionally non-blocking; the deterministic test suite is mandatory.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go mod tidy
      - name: Backtest last 180 days of SOXL / SOXS
        run: go run ./cmd/cryptoscan --pair SOXL:SOXS --days 180
      - name: Repeat request (should use cached historical candles)
        run: go run ./cmd/cryptoscan --pair SOXL:SOXS --days 180
      - name: Backtest six months of MSTR / MSTZ
        run: go run ./cmd/cryptoscan --pair MSTR:MSTZ --days 180
      - name: Check persisted SQLite dashboard endpoints
        shell: bash
        run: |
          go run ./cmd/cryptoweb --db ./data/findings.sqlite > /tmp/cryptoweb.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8080/api/groups > /tmp/groups.json; then break; fi
            sleep 2
          done
          python3 -c 'import json; g=json.load(open("/tmp/groups.json")); assert {x["symbol"] for x in g} >= {"SOXL","SOXS","MSTR","MSTZ"}; print("Dashboard SQLite groups verified:", len(g))'
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "Strategy consistency"
