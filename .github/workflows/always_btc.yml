name: Always invested BTC rotation backtest
on:
  pull_request:
    paths:
      - 'internal/alwaysbtc/**'
      - 'cmd/alwaysbtctest/**'
      - '.github/workflows/always_btc.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go test ./internal/alwaysbtc/... ./cmd/alwaysbtctest/...
      - run: mkdir -p results && go run ./cmd/alwaysbtctest --end 2026-11-07 --train-until 2026-08-08 > results/always_btc.json
      - name: Summary
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('results/always_btc.json'))
          lines=['# Always-invested BTC MSTR/MSTZ rotation','Train May 8–Aug 7, holdout Aug 8–Nov 7 2026; Yahoo hourly; 10 bps each side.','']
          for k in ('training','holdout','fixed_holdout'):
            r=d[k];p=r['params']
            lines.append(f"**{k}**: return {r['return_pct']:+.2f}%, max drawdown {r['max_drawdown_pct']:.2f}%, switches {r['switches']}, MSTR sessions {r['mstr_sessions']}, MSTZ sessions {r['mstz_sessions']}, active {r['active']}.")
            lines.append(f"Day weight {p['day_weight']}, threshold {p['switch_threshold']}, confirm sessions {p['confirm_days']}.")
          lines.append(f"Hourly candles: BTC {d['btc_bars']}, MSTR {d['mstr_bars']}, MSTZ {d['mstz_bars']}.")
          s='\n\n'.join(lines)+'\n'
          print(s)
          open('results/summary.md','w').write(s)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(s)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: always-invested-btc-backtest
          path: results/
